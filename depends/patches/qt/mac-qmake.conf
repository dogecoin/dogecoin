MAKEFILE_GENERATOR = UNIX
CONFIG += app_bundle incremental global_init_link_order lib_version_first plugin_no_soname absolute_library_soname
QMAKE_INCREMENTAL_STYLE = sublib
include(../common/macx.conf)
include(../common/gcc-base-mac.conf)
include(../common/clang.conf)
include(../common/clang-mac.conf)
QMAKE_MAC_SDK_PATH=$${MAC_SDK_PATH}
QMAKE_XCODE_VERSION=4.3
QMAKE_XCODE_DEVELOPER_PATH=/Developer
QMAKE_MACOSX_DEPLOYMENT_TARGET = $${MAC_MIN_VERSION}
QMAKE_MAC_SDK=macosx
QMAKE_MAC_SDK.macosx.Path = $${MAC_SDK_PATH}
QMAKE_MAC_SDK.macosx.platform_name = macosx
QMAKE_MAC_SDK.macosx.SDKVersion = $${MAC_SDK_VERSION}
QMAKE_MAC_SDK.macosx.PlatformPath = /phony
!host_build: QMAKE_CFLAGS += -target $${MAC_TARGET}
# Only set when depends is told to use the clang on PATH; empty under gitian,
# whose clang finds its own headers and sibling tools. -B locates cctools' ld,
# and the two -internal-externc-isystem flags put the clang resource headers
# and then the SDK's C headers last, which is what libc++'s #include_next needs.
!host_build:!isEmpty(MAC_NATIVE_BIN): QMAKE_CFLAGS += -B$${MAC_NATIVE_BIN}
!host_build:!isEmpty(MAC_CLANG_RESOURCE_DIR): QMAKE_CFLAGS += -Xclang -internal-externc-isystem$${MAC_CLANG_RESOURCE_DIR}/include -Xclang -internal-externc-isystem$${MAC_SDK_PATH}/usr/include
!host_build: QMAKE_OBJECTIVE_CFLAGS += $$QMAKE_CFLAGS
!host_build: QMAKE_CXXFLAGS += $$QMAKE_CFLAGS
!host_build:!isEmpty(MAC_LIBCXX_PATH): QMAKE_CXXFLAGS += -isystem $${MAC_LIBCXX_PATH}/include/c++/v1

# The include search variables are exported for the NATIVE toolchain so the
# native_* packages can be built, and clang honours them when targeting darwin
# too. libc++'s stdlib.h then #include_next's straight into gcc's libstdc++
# wrapper rather than the SDK's C header, and every std:: name it means to
# re-export comes up missing:
#
#   .../libcxx/include/c++/v1/stdlib.h:94:
#     .../include/c++/stdlib.h:38:12: error: no member named 'abort' in namespace 'std'
#
# hosts/darwin.mk clears them with `env -u` for the compilers it hands to other
# packages, but qt compiles through this mkspec instead, so do the same here.
!host_build:!isEmpty(MAC_LIBCXX_PATH): QMAKE_CC = env -u C_INCLUDE_PATH -u CPLUS_INCLUDE_PATH -u OBJC_INCLUDE_PATH -u OBJCPLUS_INCLUDE_PATH -u CPATH -u LIBRARY_PATH $$QMAKE_CC
!host_build:!isEmpty(MAC_LIBCXX_PATH): QMAKE_CXX = env -u C_INCLUDE_PATH -u CPLUS_INCLUDE_PATH -u OBJC_INCLUDE_PATH -u OBJCPLUS_INCLUDE_PATH -u CPATH -u LIBRARY_PATH $$QMAKE_CXX
!host_build:!isEmpty(MAC_LIBCXX_PATH): QMAKE_LINK = $$QMAKE_CXX
!host_build:!isEmpty(MAC_LIBCXX_PATH): QMAKE_LINK_SHLIB = $$QMAKE_CXX
!host_build:!isEmpty(MAC_LIBCXX_PATH): QMAKE_LINK_C = $$QMAKE_CC
!host_build:!isEmpty(MAC_LIBCXX_PATH): QMAKE_LINK_C_SHLIB = $$QMAKE_CC
!host_build: QMAKE_LFLAGS += -target $${MAC_TARGET} -mlinker-version=$${MAC_LD64_VERSION}
# qmake keeps link flags separate from compile flags, so -B has to be repeated
# here or the link falls back to whichever ld is on PATH and fails as
# "unrecognised emulation mode: acosx_version_min".
!host_build:!isEmpty(MAC_NATIVE_BIN): QMAKE_LFLAGS += -B$${MAC_NATIVE_BIN}
QMAKE_AR = $${CROSS_COMPILE}ar cq
QMAKE_RANLIB=$${CROSS_COMPILE}ranlib
QMAKE_LIBTOOL=$${CROSS_COMPILE}libtool
QMAKE_INSTALL_NAME_TOOL=$${CROSS_COMPILE}install_name_tool
load(qt_config)
